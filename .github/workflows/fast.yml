# 快链：PR 开/更新/重开与推送到 main 时自动跑验收。
#
# 工程方案与「为什么 CI 只跑验收、突变留给本地、不挂定时」见 `docs/HLD.md` §4.5 与 ADR 0012。
#
# ── 只调命名脚本 ──
# 唯一的检查步是 `npm run verify`（`package.json` 里的命名脚本）。CI 的失败信号
# 只有一个来源——那条脚本本身；yaml 里不写裸检查命令，也不设「CI 专属」断言。
#
# ── 无凭证、离线可跑 ──
# 全部 step 只有 checkout / setup / `npm ci`（安装，不是检查）/ 命名脚本，
# 没有一处凭证引用，权限收到只读。`npm run verify` 本身不联网。
#
# ── 突变测试不在 CI ──
# `mutation:changed` 与全量棘轮都由 agent 在本地跑（`docs/MUTATION-TESTING.md`）。
# 流水线里只留验收一条，信号单一：一次推送 = 一次 `verify`。

name: fast

on:
  pull_request:
  push:
    branches: [main]

# 只读源码，最小权限；fork PR 拿到的 token 本来也只读，流水线里不出现任何凭证引用。
permissions:
  contents: read

# 连推三次不跑三遍。只在 PR 上取消：合入 main 的那次必须跑完，否则会被后续 push 取消掉。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: 验收 (verify)
    # 固定镜像，不用 `ubuntu-latest`：该 label 自 2026-10-19 起滚动迁到 Ubuntu 26.04
    # （actions/runner-images#14748，11-19 完成）。用 latest 等于把「换 OS」这件事交给
    # 平台在无人改 yaml 的时候做掉；门禁换镜像应当是显式改动 + 一次绿的 verify。
    # 今天 `ubuntu-latest` 就指向 24.04，所以钉这一版不改变行为。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 版本读 `.nvmrc`（与 `package.json#engines`、`.npmrc` 一致），不在这里另抄一份。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` 必须与 lockfile 完全一致，不能在这里悄悄改依赖树。
      - name: Install
        run: npm ci

      - name: verify
        run: npm run verify
