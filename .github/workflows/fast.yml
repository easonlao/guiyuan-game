# 快链：PR 开/更新/重开与推送到 main 时自动跑验收。
#
# 工程方案与「为什么快链自动、里程碑手动、不挂定时」见 `docs/HLD.md` §4.5 与 ADR 0012。
#
# ── 只调命名脚本 ──
# 唯一的检查步是 `npm run verify`（`package.json` 里的命名脚本）。CI 的失败信号
# 只有一个来源——那条脚本本身；yaml 里不写裸检查命令，也不设「CI 专属」断言。
#
# ── 无凭证、离线可跑 ──
# 全部 step 只有 checkout / setup / `npm ci`（安装，不是检查）/ 命名脚本，
# 没有一处凭证引用，权限收到只读。`npm run verify` 本身不联网。
#
# ── 观测项 ──
# `mutation:changed` 作为**观测项**跑：红了不阻断验收 job，只把报告落盘成可下载
# artifact。它**不能**当门禁——子集报告做不了棘轮对比（`mutation:check` 会退 `2`）。

name: fast

on:
  pull_request:
  push:
    branches: [main]

# 只读源码，最小权限；fork PR 拿到的 token 本来也只读，流水线里不出现任何凭证引用。
permissions:
  contents: read

# 连推三次不跑三遍。只在 PR 上取消：合入 main 的那次必须跑完，否则会被后续 push 取消掉。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: 验收 (verify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 版本读 `.nvmrc`（与 `package.json#engines`、`.npmrc` 一致），不在这里另抄一份。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` 必须与 lockfile 完全一致，不能在这里悄悄改依赖树。
      - name: Install
        run: npm ci

      - name: verify
        run: npm run verify

  mutation-changed:
    name: 改动变异观测项 (mutation:changed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 观测项：job 红了不把整条流水线判红，但报告仍要落盘（见上面的「观测项」说明）。
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 需要完整历史：脚本要相对基线 ref 算「改了哪些文件」。
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # 基线 ref 必须传：`mutation:changed` 靠它判定「改动文件」，不传就无从比较。
      #   - PR：base.sha（checkout 默认检出 merge commit，diff 出来的就是本 PR 的改动）
      #   - push 到 main：event.before（本次推送前的 HEAD）；建分支时它是全零 SHA，要挡掉
      - name: mutation:changed
        run: npm run mutation:changed -- ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD~1' }}

      # 观测项红了也要传产物——红的那次最需要看报告。`if: always()` 保证前一步失败也上传。
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-changed-report
          path: reports/
          if-no-files-found: warn
          retention-days: 14
