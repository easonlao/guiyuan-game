# 里程碑：全量突变测试 + 棘轮对比，**只能手动触发**。
#
# 工程方案与「为什么不挂定时」见 `docs/HLD.md` §4.5 与 ADR 0012。
#
# ── 谁来按这个按钮 ──
# 需求方不是开发者、不会手动触发，实际触发者只能是 agent。什么时候跑由
# `docs/MUTATION-TESTING.md` §2.2 定义（这条规则只在那里有一份），对应命令
# `npm run mutation:milestone`。
#
# ── 只调命名脚本 ──
# 唯一的执行步是 `npm run mutation:milestone`（= 全量突变测试 + 棘轮对比），yaml 里不写裸命令。

name: mutation-milestone

on:
  workflow_dispatch:

# 只读源码，最小权限；手动触发的 job 不出现任何凭证引用。
permissions:
  contents: read

jobs:
  milestone:
    name: 全量突变测试 + 棘轮 (mutation:milestone)
    # 固定镜像，不用 `ubuntu-latest`：该 label 自 2026-10-19 起滚动迁到 Ubuntu 26.04
    # （actions/runner-images#14748，11-19 完成）。用 latest 等于把「换 OS」这件事交给
    # 平台在无人改 yaml 的时候做掉；门禁换镜像应当是显式改动 + 一次绿的 verify。
    # 今天 `ubuntu-latest` 就指向 24.04，所以钉这一版不改变行为。
    runs-on: ubuntu-24.04
    # 全量耗时较长（见 `docs/MUTATION-TESTING.md`），超时给够。
    # 实测（2026-10-18，2 vCPU runner）：1078 个突变体，dry run 1m12s，之后 118 分钟跑到 90%，
    # 折合全程约 132 分钟——原来的 120 分钟会在临门一脚处把 job 砍掉。留 ~80% 余量给
    # 「多数突变体被 Killed 但有几个吃满突变超时」的批次抖动（突变超时 ≈ timeoutMS 30000 +
    # timeoutFactor × dryRun 净耗时，单条可达 70s+）。
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` 会跑 `postinstall`（patch-package），给 Stryker 的 vitest-runner 打补丁；
      # 补丁不生效时非 static 突变体会被一律误报为 Survived（见 `docs/MUTATION-TESTING.md` §8）。
      - name: Install
        run: npm ci

      # 棘轮对比发现基线之外的新增存活/无覆盖时退出 `1`，这一步判红——这就是门禁本身。
      - name: mutation:milestone
        run: npm run mutation:milestone

      # 门禁红了也要传产物——红的那次最需要看存活明细。`if: always()` 保证失败也上传。
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-milestone-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
