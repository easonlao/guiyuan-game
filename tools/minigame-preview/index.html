<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>归元弈 · 对局预览</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080f14; }
      body { display: grid; place-items: center; }
      canvas { display: block; width: min(100vw, 460px); height: 100dvh; touch-action: none; outline: none; }
      canvas:focus-visible { outline: 1px solid #d7b879; outline-offset: -1px; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="归元弈对局。点击操作按钮出手，空格加速自动结算，R重新开局。"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
